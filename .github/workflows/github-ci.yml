name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pre-commit:

    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Check pre-commit version
        run: pre-commit --version

      - name: Set up hooks
        run: pre-commit install

      - name: Check style
        run: pre-commit run --all-files


  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
        exclude:
          - python-version: "pypy3.11"
            os: windows-2025

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Check python version
      run: python -c "import sys; import platform; print('Python %s implementation %s on %s' % (sys.version, platform.python_implementation(), sys.platform))"

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install test and numpy
      run: python -m pip install ".[test,numpy]"

    - name: Install gurobi
      if: ${{ !startsWith(matrix.python-version, 'pypy') }}
      run: python -m pip install ".[gurobi]"

    - name: Install highs
      run: python -m pip install ".[highs]"

    - name: Install scip
      if: ${{ !startsWith(matrix.python-version, 'pypy') }}
      run: python -m pip install ".[scip]"

    - name: Verify required solver backends
      shell: python
      run: |
        import math
        import platform
        from mip import BINARY, CBC, CONTINUOUS, HIGHS, SCIP, Model, OptimizationStatus

        solvers = [CBC, HIGHS]
        if platform.python_implementation() == "CPython":
            solvers.append(SCIP)
        for solver in solvers:
            for var_type in (CONTINUOUS, BINARY):
                model = Model(solver_name=solver)
                model.verbose = 0
                x = model.add_var(var_type=var_type, ub=1, obj=1)
                model += x >= 0.5
                expected = 1 if var_type == BINARY else 0.5
                status = model.optimize()
                if status != OptimizationStatus.OPTIMAL or not math.isclose(x.x, expected):
                    raise RuntimeError(f"{solver} failed the {var_type} smoke test")
            print(f"{solver}: LP and MILP verified")

    - name: list installed packages
      run: python -m pip list

    - name: Run tests
      run: python -m pytest test --verbose --color=yes --doctest-modules -Werror
